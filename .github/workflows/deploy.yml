name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # Never let two deploys to the same environment run at once. ECS will
  # happily accept both and leave the service on whichever finishes last.
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: synthecore
            context: services/synthecore
            dockerfile: services/synthecore/Dockerfile
          - service: fidelitycheck
            context: services/fidelitycheck
            dockerfile: services/fidelitycheck/Dockerfile
          - service: fhirlink
            context: services/fhirlink
            dockerfile: services/fhirlink/Dockerfile
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        # OIDC rather than long lived access keys. There are no AWS secrets
        # stored in this repository.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # The SyntheCore production image installs the private generation
          # engine from the private index. The public image does not have
          # access to this secret and falls back to the stub, which is the
          # intended behaviour for anyone building from the public repo.
          secrets: |
            pip_netrc=${{ secrets.PRIVATE_INDEX_NETRC }}
          build-args: |
            PRIVATE_INDEX_URL=${{ secrets.PRIVATE_INDEX_URL }}
            NEXT_PUBLIC_SYNTHECORE_URL=${{ vars.PUBLIC_SYNTHECORE_URL }}
            NEXT_PUBLIC_FIDELITYCHECK_URL=${{ vars.PUBLIC_FIDELITYCHECK_URL }}
            NEXT_PUBLIC_FHIRLINK_URL=${{ vars.PUBLIC_FHIRLINK_URL }}
          tags: |
            ${{ env.ECR_REGISTRY }}/pretrial-${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/pretrial-${{ matrix.service }}:latest
          cache-from: type=gha,scope=deploy-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.service }}

  deploy:
    name: Roll out ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'production' }}
    strategy:
      # Sequential. The worker and the API share an image, and rolling them
      # out in parallel can leave a new worker consuming jobs enqueued by an
      # old API for the length of the deploy.
      max-parallel: 1
      matrix:
        service: [fidelitycheck, fhirlink, synthecore, synthecore-worker, web]

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force a new deployment
        run: |
          aws ecs update-service \
            --cluster "pretrial-${{ inputs.environment || 'production' }}" \
            --service "pretrial-${{ matrix.service }}" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for the service to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "pretrial-${{ inputs.environment || 'production' }}" \
            --services "pretrial-${{ matrix.service }}"

  verify:
    name: Post deploy health check
    runs-on: ubuntu-latest
    needs: deploy
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Every service answers /health
        run: |
          for url in \
            "${{ vars.PUBLIC_SYNTHECORE_URL }}" \
            "${{ vars.PUBLIC_FIDELITYCHECK_URL }}" \
            "${{ vars.PUBLIC_FHIRLINK_URL }}"; do
            echo "checking $url/health"
            curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$url/health" > /dev/null
          done
          echo "all services healthy"

      - name: SyntheCore is running the private engine
        # A production deployment silently falling back to the bootstrap stub
        # would keep serving requests and produce cohorts that must never
        # leave the building. Failing the deploy is the correct response.
        run: |
          is_stub=$(curl -fsS "${{ vars.PUBLIC_SYNTHECORE_URL }}/engine" \
            | python -c "import json,sys; print(json.load(sys.stdin)['data']['is_stub'])")
          if [ "$is_stub" != "False" ]; then
            echo "Deployed SyntheCore is running the placeholder generator."
            exit 1
          fi
          echo "Private engine active."
